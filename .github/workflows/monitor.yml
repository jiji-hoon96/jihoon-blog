name: Weekly monitor

# Sentry 미해결 이슈와 SEO 크롤 결과를 GitHub 이슈 하나에 모으고,
# 고칠 항목이 있으면 Claude 가 고친 PR 을 연다. 머지는 사람이 한다.
#
# - 매주 월요일 10:00 KST (= 01:00 UTC). GSC 수집(09:00) 다음이다.
# - 이슈는 `monitor` 라벨로 찾는다. 열린 것이 없으면 새로 만들고, 있으면 본문을 덮어쓴다.
#   본문 수정은 알림이 가지 않으므로 새로 생긴 항목이 있을 때만 댓글을 단다.
# - 의도한 예외는 scripts/monitor/seo.mjs 의 EXPECTED_NOINDEX 와
#   scripts/monitor/sentry.mjs 의 IGNORED_SENTRY_ISSUES 에 이유와 함께 적는다.
#   프롬프트로 예외를 설명하지 않는다. 그러면 매주 같은 것을 고치려 든다.
#
# 필요한 Secrets
#   SENTRY_READ_TOKEN        Sentry 이슈 읽기 토큰. 소스맵 업로드 토큰과 따로 둔다.
#   CLAUDE_CODE_OAUTH_TOKEN  Claude Code 의 /install-github-app 이 넣는다.
#                            없으면 고치는 단계만 건너뛰고 이슈는 그대로 갱신된다.

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

concurrency:
  group: weekly-monitor
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    outputs:
      issue: ${{ steps.issue.outputs.number }}
      actionable: ${{ steps.run.outputs.actionable }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read the previous report
        id: previous
        run: |
          gh label create monitor --color FBCA04 --description 'Weekly Sentry and SEO monitor' 2>/dev/null || true
          number=$(gh issue list --label monitor --state open --limit 1 --json number -q '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then gh issue view "$number" --json body -q .body > previous.md; fi

      - name: Collect Sentry and crawl production
        id: run
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
        run: node scripts/monitor/report.mjs --previous previous.md | tee -a "$GITHUB_OUTPUT"

      - name: Update the tracking issue
        id: issue
        run: |
          number='${{ steps.previous.outputs.number }}'
          if [ -z "$number" ]; then
            url=$(gh issue create --title '주간 모니터링: Sentry · SEO' --label monitor --body-file monitor-report.md)
            number=${url##*/}
          else
            gh issue edit "$number" --body-file monitor-report.md
            if [ '${{ steps.run.outputs.fresh }}' != '0' ]; then
              gh issue comment "$number" --body "새로 생긴 항목 ${{ steps.run.outputs.fresh }}건. 전체 ${{ steps.run.outputs.actionable }}건은 본문에 있다. (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            fi
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          {
            echo "## 주간 모니터링"
            echo ""
            echo "고칠 항목 ${{ steps.run.outputs.actionable }}건, 새로 생긴 것 ${{ steps.run.outputs.fresh }}건. 이슈 #$number"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: monitor-report-${{ github.run_id }}
          path: monitor-report.*
          retention-days: 30

  fix:
    needs: report
    if: needs.report.outputs.actionable != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # GH_TOKEN 을 잡 단위로 두지 않는다. gh 는 GH_TOKEN 을 먼저 읽으므로 Claude 의
    # `gh pr create` 가 GITHUB_TOKEN 으로 PR 을 열게 되고, 그 PR 에는 ci.yml 이 돌지 않는다.
    steps:
      - name: Check preconditions
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          # 지난주 PR 이 아직 열려 있으면 같은 것을 또 고치지 않는다.
          open=$(gh pr list --repo '${{ github.repository }}' --state open --json headRefName \
            -q '[.[] | select(.headRefName | startswith("monitor/"))] | length')
          if [ "$HAS_TOKEN" != 'true' ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN 이 없어 고치는 단계를 건너뛴다." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$open" != '0' ]; then
            echo "monitor/ 브랜치의 PR 이 열려 있어 건너뛴다." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.run == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.run == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ needs.report.outputs.issue }}

            `gh issue view ${{ needs.report.outputs.issue }}` 의 본문이 이번 주 모니터링 결과다.
            CLAUDE.md 를 먼저 읽고 그 규칙을 따른다. 특히 한글 원문을 고치면 번역본 sourceHash 를 갱신한다.

            1. 각 항목의 원인을 리포 코드와 콘텐츠에서 찾는다. Sentry 항목은 Sentry API 대신 본문에 적힌 정보와 코드로 판단한다.
            2. 고칠 수 있는 것은 고친다. 의도한 동작이라고 판단되면 고치지 말고
               scripts/monitor/ 의 제외 목록에 이유와 함께 추가한다.
            3. `pnpm test` 와 `pnpm build` 가 통과해야 한다.
            4. `monitor/` 로 시작하는 새 브랜치에 커밋하고 `gh pr create` 로 PR 을 연다.
               PR 본문에 `Refs #${{ needs.report.outputs.issue }}` 와 항목별로 고친 것, 제외한 것, 못 고친 것과 이유를 적는다.
            5. 머지하지 않는다. 이슈를 닫지 않는다.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(git:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr list:*)"
